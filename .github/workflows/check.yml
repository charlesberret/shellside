name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build packages
        run: npm run build

      - name: Package tests
        run: npm run test

      - name: Reference build (toy fixture)
        run: node scripts/prepare-reference-content.mjs && npm run build:reference

      - name: Reference + public-output checks
        run: node scripts/check-reference.mjs && node scripts/check-public-output.mjs && node --test scripts/*.test.mjs

      - name: Demo build + leak audit
        run: node ../../node_modules/astro/astro.js build && node scripts/check.mjs
        working-directory: apps/demo

      - name: Dev-desk smoke (astro dev routes — not covered by builds)
        run: node scripts/check-desk.mjs

      - name: create-site scaffold smoke (second site from zero)
        run: |
          node scripts/create-site.mjs /tmp/ci-scratch --name "CI Scratch"
          cd /tmp/ci-scratch
          npm install
          npm run build
          npm run check
