    visibility: 'published'
  - id: 'filesystem-ia'
    title: 'ADR — filesystem as information architecture'
    kind: 'decision'
    summary: '**Context:** patron ask — "a simple system directory architecture in which the flat file and folder structure determines page content, headings, subheadings, etc. for the main page, whereas dotfiles and hidden directories appear only in the console view. Site and page configs are given in hidden plaintext files with read-only access in console mode." Extends `2026-10-16-site-instance-contract.md`.'
    url: 'https://github.com/charlesberret/shellside/blob/main/docs/decisions/2026-10-17-filesystem-ia.md'
    visibility: 'published'
  - id: 'site-instance-contract'
    title: 'ADR — site-instance contract: what a shellside site declares'
    kind: 'decision'
    summary: '**Context:** the alignment plan (`docs/ALIGNMENT.md`) aims at the marquee becoming an *instance* of shellside — content + config + taste. This is the design spike for the boundary. The marquee''s own Phase-4 roadmap row ("site config, nav-from-config, portable kit") names the same target.'
    url: 'https://github.com/charlesberret/shellside/blob/main/docs/decisions/2026-10-16-site-instance-contract.md'
    visibility: 'published'
  - id: 'vendored-package-consumption'
    title: 'ADR 2026-10-11: Marquee consumes shellside via vendored builds — context'
    kind: 'decision'
    summary: 'The marquee (charlesberret.net) deploys from a self-hosted runner that checks out only the marquee repo. A `file:../shellside` dependency cannot resolve there (marquee commit `0ef4785` removed it for exactly this reason), and the kit is not published to any registry. Meanwhile every promoted contract (content-model, edit-protocol, look, dev-api) needs a working consumer for proof A to be real.'
    url: 'https://github.com/charlesberret/shellside/blob/main/docs/decisions/2026-10-11-vendored-package-consumption.md'
    visibility: 'published'
