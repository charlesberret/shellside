    kind: 'doc'
    summary: '**Date:** 2026-10-18 · **Scope:** the R1 milestone (edit protocol, content-model, look, dev-api, preview-bridge, reference collections, site-instance contract; the README-path ruling still open inside it) plus the post-milestone IA arc that landed in the same week (console-engine, the host, create-site, filesystem-IA). Written as the R1 close-out.'
