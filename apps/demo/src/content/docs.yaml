  - id: 'are-you-insane'
    title: 'Are you insane? This is a really bad idea. — the public console'
    kind: 'doc'
    summary: 'The editorial desk does write to the server. It is an HTTP API in the dev process, it has no accounts, and a passing `Host` header is the whole of its network check. Running that process where other people can open the port gives them the content files.'
    url: 'https://github.com/charlesberret/shellside/blob/main/docs/ARE_YOU_INSANE.md'
    visibility: 'published'
