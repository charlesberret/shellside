title: 'Releases'
items:
  - id: 'v0-1-0'
    title: 'v0.1.0'
    type: 'release'
    date: '2026-10-15'
    summary: 'R0: the extraction gate. Contracts and machinery extracted from charlesberret.net and consumed by it.'
    url: 'https://github.com/charlesberret/shellside/releases/tag/v0.1.0'
    visibility: 'published'
  - id: 'v0-2-0'
    title: 'v0.2.0'
    type: 'release'
    date: '2026-10-15'
    summary: 'R1 progress: the kit now covers the console surface. Anyone consuming the packages can project their filtered collections into a VFS and serve a working `ls`/`cat` console — as the reference app does — without writing tree plumbing. No consumer action needed; nothing a site relies on broke.'
    url: 'https://github.com/charlesberret/shellside/releases/tag/v0.2.0'
    visibility: 'published'
  - id: 'v0-3-0'
    title: 'v0.3.0'
    type: 'release'
    date: '2026-10-16'
    summary: 'The kit completes the grand-plan lane: engine mechanics, the config-driven host, the create-site scaffold, and the shared leak audit are all in. The console-vfs node-vocabulary change is **breaking within 0.x** — consumers using `t:"chr"`/`read`/`bin.href` must adopt `t:"c"`/`gen()`/`bin.url`.'
    url: 'https://github.com/charlesberret/shellside/releases/tag/v0.3.0'
    visibility: 'published'
  - id: 'v0-4-0'
    title: 'v0.4.0'
    type: 'release'
    date: '2026-10-17'
    summary: 'The filesystem-IA + public-surface release: the content tree is now the site''s information architecture, and the packaged console became a real engine-driven shell.'
    url: 'https://github.com/charlesberret/shellside/releases/tag/v0.4.0'
    visibility: 'published'
